apiVersion: apps/v1
kind: Deployment
metadata:
  name: icecast
  namespace: friendslikeus-dev
  labels:
    app: icecast
spec:
  replicas: 1
  selector:
    matchLabels:
      app: icecast
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: icecast
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: icecast
          image: moul/icecast
          imagePullPolicy: IfNotPresent
          ports:
            - name: stream
              containerPort: 8000
              protocol: TCP
          env:
            - name: ICECAST_HOST
              value: "icecast.friendslikeus-dev.svc.cluster.local"
            - name: ICECAST_PORT
              value: "8000"
            - name: ICECAST_MOUNT
              value: "/song.mp3"
            - name: ICECAST_USER
              value: "source"
            - name: ICECAST_PASS
              value: "hackme"
          volumeMounts:
            - name: icecast-config
              mountPath: /etc/icecast2/icecast.xml
              subPath: icecast.xml
            - name: icecast-logs
              mountPath: /var/log/icecast2
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /status.xsl
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /status.xsl
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /status.xsl
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
      volumes:
        - name: icecast-config
          configMap:
            name: icecast-config
        - name: icecast-logs
          emptyDir:
            sizeLimit: 500Mi
---
apiVersion: v1
kind: Service
metadata:
  name: icecast
  namespace: friendslikeus-dev
  labels:
    app: icecast
spec:
  type: ClusterIP
  selector:
    app: icecast
  ports:
    - name: stream
      protocol: TCP
      port: 8000
      targetPort: 8000