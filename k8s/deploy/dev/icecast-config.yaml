apiVersion: v1
kind: ConfigMap
metadata:
  name: icecast-config
  namespace: friendslikeus-dev
data:
  icecast.xml: |
    <icecast>
      <location>Earth</location>
      <admin>admin@friendslikeus.com</admin>

      <limits>
        <clients>500</clients>
        <sources>10</sources>
        <threadpool>5</threadpool>
        <queue-size>524288</queue-size>
        <client-timeout>30</client-timeout>
        <header-timeout>15</header-timeout>
        <source-timeout>10</source-timeout>
        <burst-on-connect>1</burst-on-connect>
        <burst-size>65536</burst-size>
      </limits>

      <authentication>
        <source-password>hackme</source-password>
        <relay-password>hackme</relay-password>
        <admin-user>source</admin-user>
        <admin-password>hackme</admin-password>
      </authentication>

      <hostname>icecast.friendslikeus-dev.svc.cluster.local</hostname>

      <listen-socket>
        <port>8000</port>
      </listen-socket>

      <http-headers>
        <header name="Access-Control-Allow-Origin" value="*" />
        <header name="Access-Control-Allow-Headers" value="Origin, Accept, X-Requested-With" />
        <header name="Access-Control-Allow-Methods" value="GET, OPTIONS" />
        <header name="Cache-Control" value="no-cache, no-store" />
        <header name="Pragma" value="no-cache" />
      </http-headers>

      <mount type="normal">
        <mount-name>/song.mp3</mount-name>
        <max-listeners>500</max-listeners>
        <max-listener-duration>0</max-listener-duration>
        <burst-size>65536</burst-size>
        <stream-name>FriendsLikeUs Radio</stream-name>
        <stream-description>FriendsLikeUs Live Stream</stream-description>
        <stream-url>https://friendslikeus.com</stream-url>
        <genre>Various</genre>
        <public>0</public>
        <hidden>0</hidden>
      </mount>

      <fileserve>1</fileserve>

      <paths>
        <basedir>/usr/share/icecast2</basedir>
        <logdir>/var/log/icecast2</logdir>
        <webroot>/usr/share/icecast2/web</webroot>
        <adminroot>/usr/share/icecast2/admin</adminroot>
        <pidfile>/var/run/icecast2/icecast2.pid</pidfile>
        <alias source="/" destination="/status.xsl"/>
      </paths>

      <logging>
        <accesslog>access.log</accesslog>
        <errorlog>error.log</errorlog>
        <playlistlog>playlist.log</playlistlog>
        <loglevel>2</loglevel>
        <logsize>10000</logsize>
        <logarchive>1</logarchive>
      </logging>

      <security>
        <chroot>0</chroot>
      </security>
    </icecast>