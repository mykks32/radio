# Kubernetes API version for autoscaling
apiVersion: autoscaling/v2

# Resource type
kind: HorizontalPodAutoscaler

# HPA metadata
metadata:
  # HPA name
  name: radio
  # Namespace
  namespace: radio
  # Labels for organizing and selecting resources
  labels:
    app: radio

# HPA specification
spec:
  # Target workload to scale
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: radio

  # Minimum number of pods
  minReplicas: 2

  # Maximum number of pods
  maxReplicas: 5

  # Scaling metrics
  metrics:
    - type: Resource
      resource:
        name: cpu

        target:
          type: Utilization   # Based on CPU usage %
          averageUtilization: 70