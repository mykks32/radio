# Application services
services:
  # Radio application service
  radio:

    # Build configuration
    build:
      # Project root context
      context: ..
      # Dockerfile location
      dockerfile: docker/Dockerfile

    # Container name
    container_name: radio

    # Port mapping
    ports:
      - "3000:3000"

    # Environment variables file
    env_file:
      - ../.env

    # Restart policy
    restart: unless-stopped